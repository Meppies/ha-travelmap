[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.travelmap"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["custom_components/travelmap"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR2004", "PLR0913", "E501", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0917", "PLR0915"]
