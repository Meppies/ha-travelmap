name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements_test.txt
      - name: Lint
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95
      - name: Types
        run: mypy
      - name: Card syntax
        run: |
          node --check custom_components/travelmap/www/travelmap-card.js
          node --check custom_components/travelmap/www/travelmap-panel.js
